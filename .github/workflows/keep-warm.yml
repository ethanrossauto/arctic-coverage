# Warms the database ON REQUEST, before showing the site to somebody.
#
# 🔴 THIS NO LONGER RUNS ON A SCHEDULE, AND THE REASON IS THE WHOLE POINT OF THE FILE.
# It used to ping every five minutes around the clock so that nobody ever met a cold start.
# That worked, and it cost about 6 CU-hours a day at the 0.25 CU floor against a free-plan
# allowance of 100 a month. **Exceeding the allowance does not throttle the compute, it
# suspends it** until the next billing period or an upgrade. So the failure mode of always
# being instant was being gone for days, arriving all at once. Six a day against a hundred
# a month is the whole argument: it does not fit, and it was not going to.
#
# 🔑 THE APP HANDLES A COLD START NOW, WHICH IS WHAT MADE THIS SAFE TO STOP. The console
# opens on an entry screen that needs no data, starts the wake as the page loads, and says
# what it is waiting for. A visitor arriving at a quiet moment meets a button and a few
# seconds, rather than a live map that appears to be broken. See `src/session.ts` for the
# design and for the invariant it holds.
#
# ⚠️ SO THE COST THAT REMAINS IS TRAFFIC-SHAPED RATHER THAN CONSTANT, which is the whole
# saving: the compute is up while somebody is using the site and for twenty minutes after,
# instead of for every hour of every day whether anyone came or not.
#
# ▶ RUN IT BY HAND BEFORE A DEMO. That is what this file is for now: press "Run workflow"
# a minute before showing the site to somebody and the first load will be warm. One run
# pings for about four and a half minutes.
#
# ⚠️ IT REMOVES THE COLD SPIKE AND NOTHING ELSE. Warm, a connection to the pooled endpoint
# still costs a few hundred milliseconds and a command opens several. That is a separate
# problem and no amount of pinging touches it.
#
# ⛔ DO NOT PUT THE SCHEDULE BACK WITHOUT DOING THE ARITHMETIC AGAIN. The numbers above are
# what the schedule cost against a free plan; on a paid plan the trade is different and the
# answer might genuinely be yes. Restoring the cron because a cold start felt slow, without
# checking what the allowance can carry, is how the suspension happens.

name: warm the database before a demo

on:
  # 🔒 MANUAL ONLY, DELIBERATELY. The `schedule:` trigger that used to sit here is what
  # spent the allowance; see the header for the arithmetic and for what replaced it.
  workflow_dispatch:

# Overlapping runs are pointless but harmless; queueing them would be worse, because a
# backlog of delayed pings all firing at once warms nothing that is not already warm.
concurrency:
  group: keep-warm
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the health endpoint for long enough to be worth pressing
        run: |
          # The health endpoint runs a real query, so reaching it is what keeps the
          # compute up. A static asset would be served from the edge and touch nothing.
          URL="https://coverage.skryer.ca/api/healthz"
          fail=0
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 45 "$URL" || echo 000)
            reachable=$(python3 -c "import json;print(json.load(open('/tmp/out.json'))['database']['reachable'])" 2>/dev/null || echo "unknown")
            echo "$(date -u '+%H:%M:%S')Z  ping $i  HTTP $code  database reachable: $reachable"
            # ⚠️ A 200 IS NOT ENOUGH. The endpoint answers even when the database is
            # unreachable, deliberately, so that "the app is up but the data is not" can
            # be told apart from "the app is down". Checking only the status code would
            # report a warm database while it was in fact unreachable.
            if [ "$code" != "200" ] || [ "$reachable" != "True" ]; then
              fail=$((fail + 1))
            fi
            [ "$i" -lt 5 ] && sleep 55
          done
          # Failing the run when every attempt failed says so to the person who pressed the
          # button, which is the only person who will look. A warm-up that quietly pinged
          # nothing would send them into a demo believing the site was ready.
          if [ "$fail" -ge 5 ]; then
            echo "::error::every ping failed; the site or its database is down"
            exit 1
          fi
